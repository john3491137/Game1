let state={cash:84,savings:24,goal:12,level:0,completed:[],stars:0,character:null,selected:0,coop:false,partner:'隊友',answered:false,bankFixed:false,fruitTurns:0,fruitPlanted:false,fruitYield:0,lemonDone:false,lemonProfits:0,events:[],stats:{compare:0,saving:0,risk:0,goal:0,choices:0,spent:0,earned:0},outcome:[],sessionSeed:Math.random()};
const save=()=>{try{localStorage.setItem('coinAdventureV1',JSON.stringify(state))}catch(e){}};

const fmt=n=>'$'+Math.max(0,Math.round(n));
function updateSide(){let total=state.cash+state.savings+state.goal;$('#totalMoney').textContent='💰 '+fmt(total);$('#cashVal').textContent=fmt(state.cash);$('#saveVal').textContent=fmt(state.savings);$('#goalVal').textContent=fmt(state.goal);$('#cashBar').style.width=Math.min(100,state.cash/Math.max(total,1)*100)+'%';$('#saveBar').style.width=Math.min(100,state.savings/Math.max(total,1)*100)+'%';$('#goalBar').style.width=Math.min(100,state.goal/Math.max(total,1)*100)+'%';$('#avatar').textContent=state.character?characters[state.character].icon:'🧭';$('#playerName').textContent=state.coop?'雙人理財小隊':state.character?characters[state.character].name:'尚未選角';$('#playerRole').textContent=state.coop?'你和隊友一起管理園遊會資金':state.character?characters[state.character].role:'選擇你的冒險角色';$('#starCount').textContent=state.stars+' 顆星';$('#progress').innerHTML=levels.map((_,i)=>`<i class="${i<state.completed.length?'on':''}"></i>`).join('');let badges=[['⭐ 理財星星',state.stars>=3],['⏳ 耐心徽章',state.fruitTurns>=3],['🔎 比較高手',state.stats.compare>=1],['🛡️ 風險偵探',state.stats.risk>=1],['🌟 夢想規劃師',state.stats.goal>=1]];$('#achievements').innerHTML=badges.map(([n,ok])=>`<span class="badge ${ok?'earned':''}">${n}</span>`).join('');$('#tip').innerHTML='<strong>'+levels[Math.min(state.level,4)].tip+'</strong><br>想想看：這個選擇會怎樣影響你的下一步？';$('#cashTag').textContent=state.coop?'園遊會基金':'零用錢';}
function updateMap(){ $$('.node').forEach((n,i)=>{n.classList.toggle('done',state.completed.includes(i));n.classList.toggle('current',i===state.level&&!state.completed.includes(i));n.classList.toggle('locked',i>state.level);n.disabled=i>state.level;});$('#mapStatus').textContent=state.level>=5?'恭喜完成冒險！':`已完成 ${state.completed.length} / 5 關`;}
function renderLevel(){updateSide();updateMap();if(state.level>=5){renderEnding();return}let l=levels[state.level],html=`<div class="stage-title"><div class="stage-icon">${l.icon}</div><div><h2>${l.title}</h2><p>${l.tag}　·　完成任務才能前進</p></div>${state.coop?'<span class="cooplabel">🤝 合作模式</span>':''}</div><p class="stage-copy">${state.coop?'你和'+state.partner+'一起商量：':''}${l.text}</p><div class="budgetline"><span class="stat-chip">💵 可用錢 <b>${fmt(state.cash)}</b></span><span class="stat-chip">🏦 存款 <b>${fmt(state.savings)}</b></span><span class="stat-chip">🌱 夢想金 <b>${fmt(state.goal)}</b></span></div><div class="choices">${l.choices.map((c,i)=>`<button class="choice" data-choice="${i}" ${state.answered?'disabled':''}><b>${c[0]}</b><span>${c[1]}</span></button>`).join('')}</div><div class="feedback ${state.answered?'show':''}" id="feedback">${state.outcome.at(-1)||''}</div><div class="nextrow"><span class="small">✨ 每次選擇都會帶來不同故事結果</span><button class="primary" id="nextBtn" ${state.answered?'':'disabled'}>${state.level===4?'領取獎牌 🏅':'完成任務，前進 →'}</button>${state.answered&&state.level>=2?`<button class="secondary" id="medalBtn">先領${state.level===2?'銅':'銀'}牌，結束本次冒險</button>`:''}</div>`;$('#gameCard').innerHTML=html;$$('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));$('#nextBtn').onclick=nextLevel;if($('#medalBtn'))$('#medalBtn').onclick=()=>{state.completed=[...new Set([...state.completed,state.level])];state.level=5;save();renderLevel();confetti()};}
function autoSave(amount){if(amount<=0)return 0;let part=Math.max(1,Math.floor(amount*.2));part=Math.min(part,state.cash);state.cash-=part;state.savings+=part;if(state.character===1)state.savings+=2;state.stats.saving++;return part}
function choose(i){if(state.answered)return;let l=levels[state.level],good=i===l.answer;state.stats.choices++;let msg='';if(state.level===0){if(i===0){state.cash=Math.max(0,state.cash-10);state.stats.spent+=10;state.stats.compare++;msg='你先照顧早餐、公車和鉛筆！用 $10 準備好必需品，剩下的錢保留作安全金。'}else if(i===1){state.cash=Math.max(0,state.cash-8);state.stats.spent+=8;msg='棉花糖很香，但你想起搭車和鉛筆更重要。下次先安排需要，旅程會更安心。'}else{msg='便宜文具很快就壞了！這次學到要把品質和使用時間一起納入總成本。';state.stats.compare++}}
if(state.level===1){state.cash+=30;state.stats.earned+=30;if(i===0){state.cash=Math.max(0,state.cash-4);state.stats.spent+=4;state.bankFixed=true;let n=autoSave(30);msg=`你修好了存錢筒（$4），收到 $30 後自動先存了 ${fmt(n)}！安全金仍留在手上。`}else if(i===1){let lost=Math.min(3,state.cash);state.cash-=lost;state.stats.spent+=lost;msg=`存錢筒還沒修好，錢沒能存進去，還有 ${fmt(lost)} 從裂縫掉出去了！下次先修理再存。`}else{state.cash=Math.max(0,state.cash-4);state.stats.spent+=4;state.bankFixed=true;let n=autoSave(30);msg=`你修好存錢筒並先存了 ${fmt(n)}。把收入全部存起來可能不方便，還要記得留安全金。`}}
if(state.level===2){if(i===0){let add=Math.min(30,state.cash);state.cash-=add;state.goal+=add;state.fruitPlanted=add===30;state.stats.spent+=add;state.stats.goal++;msg=add===30?'你投入 $30 種下果樹！接下來照顧滿 3 回合，就能期待收成。':'可用錢還不夠 $30，先保留夢想金，記得留安全金並重新挑戰。'}else if(i===1){state.cash=Math.max(0,state.cash-8);state.stats.spent+=8;msg='玩具讓你開心了一下，但果樹要多等一會兒才有收穫。你仍能重新挑戰，試試長期規劃。'}else{let add=Math.min(30,state.cash);state.cash-=add;state.goal+=add;state.fruitPlanted=add===30;state.stats.spent+=add;msg=`你投入 ${fmt(add)} 支持果樹夢想，但記得留下安全金。小樹苗還需要耐心照顧。`;state.stats.goal++}}
if(state.level===3){if(i===0){let invest=Math.min(15,state.cash);state.cash-=invest;state.stats.spent+=invest;msg=`你把 ${fmt(invest)} 分成三份，放進果園、圖書角和風車。分散投資，不把所有資源押在一個地方！`}else if(i===1){let invest=Math.min(15,state.cash);state.cash-=invest;state.stats.spent+=invest;msg=`你選了果園，但熱門也會遇到波動。這次結果平穩，記住下回可把資源分散到不同計畫。`}else{msg='你保留了資源，沒有冒險；接著可以多了解不同計畫，再做分散的選擇。'}}
if(state.level===4){if(i===0){state.stats.risk++;msg='你識破「保證賺三倍」的警訊，找到老師一起查證。真正的風險偵探會先停、先問、再決定！'}else{msg='迷宮守衛攔住你：保證獲利和陌生邀請都要提高警覺。你停下來問了老師，資金安全保住了！';state.stats.risk++}}
if(good){state.stars++;if(state.character===0){state.stars++;msg+=' 勇敢小狐的比較力又找到一顆理財星星！'}}else state.stars+=0;
if(state.level===1&&i!==0){/* 修存錢筒的情境提醒 */}state.answered=true;state.outcome.push(msg);if(state.outcome.length>6)state.outcome.shift();$('#feedback').innerHTML='✨ '+msg;$('#feedback').classList.add('show');$$('[data-choice]').forEach(x=>x.disabled=true);$('#nextBtn').disabled=false;$('#nextBtn').textContent=state.level===4?'領取獎牌 🏅':'完成任務，前進 →';updateSide();save();}
function nextLevel(){if(!state.answered)return;state.completed=[...new Set([...state.completed,state.level])];if(state.level===4){state.level=5;renderLevel();confetti();save();return}state.level++;state.answered=false;state.outcome.push('前進到 '+levels[state.level].title+'，新的驚喜正等著你！');if(state.level===2&&state.fruitPlanted){state.fruitTurns++;}renderLevel();save();if(Math.random()<.73)showEvent();}
function showEvent(){let available=eventDeck.filter(e=>!state.events.includes(e.id)||e.id==='rain'||e.id==='fruit');let e=available[Math.floor(Math.random()*available.length)];if(!e)return;state.events.push(e.id);let buttons='';if(e.kind==='mission'){buttons='<div class="choices"><button class="choice" data-lemon="1"><b>開張！定價 $3 一杯</b><span>材料 $4 可做 3 杯，算算收支。</span></button><button class="choice" data-lemon="2"><b>定價 $1.5，吸引更多客人</b><span>賣出 3 杯，扣掉材料成本。</span></button><button class="choice" data-lemon="3"><b>先問隊友、估算成本再定價</b><span>合作分工，定價 $2.5 並留一杯分享。</span></button></div>'}else if(e.kind==='risk'){buttons='<div class="choices"><button class="choice" data-risk="1"><b>不交錢，先找老師查證</b><span>保護存款，拒絕保證獲利邀請。</span></button><button class="choice" data-risk="2"><b>先投入全部安全金試試看</b><span>高風險選擇，將遇到故事後果。</span></button></div>'}else if(e.kind==='gift'){buttons='<div class="choices"><button class="choice" data-gift="1"><b>先存 $2，其他留作安全金</b><span>好習慣！將謝禮分配得剛剛好。</span></button><button class="choice" data-gift="2"><b>全部拿去買點心</b><span>偶爾享受很好，記得先想想自己的目標。</span></button></div>'}else if(e.kind==='fruit'){buttons='<div class="choices"><button class="choice" data-fruit="1"><b>澆水並耐心照顧</b><span>讓果樹任務往前一步。</span></button><button class="choice" data-fruit="2"><b>先忙別的，稍後再照顧</b><span>果樹進度暫停，夢想還在等你。</span></button></div>'}else buttons='<button class="primary" id="eventOk">知道了，繼續冒險</button>';
$('#modal').innerHTML=`<span class="event-tag">🎲 隨機冒險事件</span><h2>${e.icon} ${e.title}</h2><p>${e.text}</p>${buttons}<div class="modalfoot"><button class="secondary" id="closeModal">稍後再說</button></div>`;openModal();$('#closeModal').onclick=()=>closeModal();if($('#eventOk'))$('#eventOk').onclick=()=>{if(e.kind==='cost'){state.cash=Math.max(0,state.cash-e.amount);state.stats.spent+=e.amount;if(e.chain){state.cash+=e.chain.amount;state.stats.earned+=e.chain.amount;setTimeout(()=>toast(e.chain.icon+' '+e.chain.title+' '+e.chain.text),300);}}else if(e.kind==='gain'){state.cash+=e.amount;state.stats.earned+=e.amount;}closeModal();updateSide();save()};$$('[data-lemon]').forEach(b=>b.onclick=()=>lemonChoice(+b.dataset.lemon));$$('[data-risk]').forEach(b=>b.onclick=()=>riskChoice(+b.dataset.risk));$$('[data-gift]').forEach(b=>b.onclick=()=>giftChoice(+b.dataset.gift));$$('[data-fruit]').forEach(b=>b.onclick=()=>fruitChoice(+b.dataset.fruit));}
function lemonChoice(i){let msg='',cost=4;state.cash=Math.max(0,state.cash-cost);state.stats.spent+=cost;if(i===1){state.cash+=9;state.lemonProfits+=5;state.stats.earned+=9;msg='賣出 3 杯 × $3 = $9，扣材料 $4，淨賺 $5！'}if(i===2){state.cash+=4.5;state.lemonProfits+=.5;state.stats.earned+=4.5;msg='賣出 3 杯 × $1.5 = $4.5，扣材料 $4，淨賺 $0.5。薄利也要記得算成本！'}if(i===3){state.cash+=5;state.lemonProfits+=1;state.stats.earned+=5;msg='賣出 2 杯 × $2.5 = $5，扣材料 $4，淨賺 $1，還留了一杯和隊友分享！'}state.lemonDone=true;closeModal();updateSide();save();toast('🍋 '+msg);if(Math.random()<.55)setTimeout(()=>chainEvent(),800)}
function chainEvent(){let t=['連鎖事件：檸檬汁大受歡迎！','連鎖事件：客人推薦給朋友！','連鎖事件：下雨前賣完最後一杯！'][Math.floor(Math.random()*3)];state.cash+=2;state.stats.earned+=2;updateSide();save();toast('🎉 '+t+' 額外收入 $2！')}
function riskChoice(i){if(i===1){state.stats.risk++;state.stars++;closeModal();toast('🛡️ 查證成功！存款安全，獲得風險偵探星星。')}else{let loss=Math.min(8,state.cash);state.cash-=loss;state.stats.spent+=loss;closeModal();toast('🚨 老師及時提醒！你損失了 '+fmt(loss)+'，以後要先查證。')}updateSide();save()}
function giftChoice(i){if(i===1){let n=Math.min(2,state.cash);state.cash-=n;state.savings+=n;state.cash+=4;state.stats.earned+=6;state.stats.saving++;toast('🎁 收到 $6，先存 $2，還有 $4 可用！')}else{state.cash+=6;state.stats.earned+=6;toast('🎁 收到 $6 謝禮！點心也要安排在需要之後喔。')}closeModal();updateSide();save()}
function fruitChoice(i){if(i===1){state.fruitTurns++;let msg='果樹被澆水了！';if(state.fruitTurns>=3&&state.fruitPlanted&&state.fruitYield===0){state.fruitYield=1;state.cash+=8;state.stats.earned+=8;msg='果樹結果了！你收穫 $8 水果收入！耐心真的有回報。';}closeModal();updateSide();save();toast('🌳 '+msg)}else{closeModal();toast('🌱 果樹等待你的照顧，記得耐心完成 3 回合任務。')}}
function renderEnding(){updateSide();updateMap();let medal=state.completed.length>=5?'🏅 金牌':state.completed.length>=4?'🥈 銀牌':state.completed.length>=3?'🥉 銅牌':'✨ 勇敢出發';let titles=[['最會存錢',state.savings],['最懂比較',state.stats.compare],['風險偵探',state.stats.risk],['夢想規劃師',state.stats.goal],['檸檬小老闆',state.lemonProfits]];let best=titles.sort((a,b)=>b[1]-a[1])[0][0];$('#gameCard').innerHTML=`<div class="ending"><div class="trophy">${state.completed.length>=5?'🏆':'🎒'}</div><span class="event-tag">冒險結算</span><h2>${state.completed.length>=5?'太棒了，金牌冒險者！':'你已完成這一段旅程！'}</h2><p>你和${state.coop?'隊友':'夥伴'}一起完成了 ${state.completed.length} 個關卡，帶著新的理財本領回到零用錢村。</p><div class="ending-grid"><div class="enditem"><span>獲得獎牌</span><b>${medal}</b></div><div class="enditem"><span>冒險星星</span><b>⭐ ${state.stars} 顆</b></div><div class="enditem"><span>專屬稱號</span><b>🌟 ${best}</b></div><div class="enditem"><span>錢包總額</span><b>💰 ${fmt(state.cash+state.savings+state.goal)}</b></div></div><p>你學會了需要優先、先存後花、比較總成本、保留安全金、分散風險，遇到陌生提議先查證！</p><button class="primary" id="replayBtn">再玩一次，試試不同策略 ↻</button></div>`;$('#replayBtn').onclick=()=>{resetGame(false);openCharacter()};}
function openModal(){ $('#modalback').classList.add('open') }function closeModal(){ $('#modalback').classList.remove('open') }
function openCharacter(){let selected=state.character??0;$('#modal').innerHTML=`<h2>選擇你的冒險角色</h2><p>三位小隊員各有理財專長，選一位陪你出發！也可以邀請家人或同學一起合作。</p><div class="characters">${characters.map((c,i)=>`<button class="character ${i===selected?'selected':''}" data-char="${i}"><div class="big">${c.icon}</div><b>${c.name}</b><small>${c.role}</small></button>`).join('')}</div><div class="modegrid"><button class="mode" data-mode="solo"><b>🧭 自己冒險</b><small>自己做決定，挑戰五個關卡</small></button><button class="mode" data-mode="coop"><b>🤝 合作模式</b><small>兩人共同管理園遊會資金</small></button></div><div id="partnerField" style="display:none;margin-top:12px"><label class="small">隊友名字</label><input id="partnerInput" value="${state.partner}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-top:4px"></div><div class="modalfoot"><button class="primary" id="startBtn">出發冒險！</button></div>`;openModal();$$('[data-char]').forEach(b=>b.onclick=()=>{selected=+b.dataset.char;$$('[data-char]').forEach(x=>x.classList.toggle('selected',x===b))});$$('[data-mode]').forEach(b=>b.onclick=()=>{state.coop=b.dataset.mode==='coop';$('#partnerField').style.display=state.coop?'block':'none';$$('[data-mode]').forEach(x=>x.style.borderColor=x===b?'#eda64d':'')});$('#startBtn').onclick=()=>{state.character=selected;if(state.coop)state.partner=$('#partnerInput').value.trim()||'隊友';closeModal();renderLevel();save();if(!state.events.includes('welcome')){state.events.push('welcome');setTimeout(()=>{if(state.level===0&&!state.answered)showEvent()},350)}}}
function resetGame(ask=true){if(ask&&!confirm('要重新開始嗎？目前的冒險進度會清除。'))return;state={cash:84,savings:24,goal:12,level:0,completed:[],stars:0,character:null,selected:0,coop:false,partner:'隊友',answered:false,bankFixed:false,fruitTurns:0,fruitPlanted:false,fruitYield:0,lemonDone:false,lemonProfits:0,events:[],stats:{compare:0,saving:0,risk:0,goal:0,choices:0,spent:0,earned:0},outcome:[],sessionSeed:Math.random()};save();renderLevel();if(ask)openCharacter()}

function help(){ $('#modal').innerHTML='<h2>🧭 冒險小指南</h2><p>從零用錢村出發，依序完成五個任務。完成 3 關得銅牌、4 關得銀牌、5 關得金牌。每次收錢會先自動存下一部分；小隊的選擇也會改變故事、錢包和隨機事件。</p><p><b>🐷 存錢筒規則：</b>先花 $4 修好，再把收入的 20% 存起來；小熊會多存 $2。記得留安全金，不要把錢全花光。</p><p><b>🌳 果樹規則：</b>先放夢想金種樹，照顧滿 3 回合會收穫 $8。耐心徽章也會解鎖！</p><p><b>🍋 檸檬汁小攤：</b>材料 $4 可做 3 杯，選擇售價並計算總收入與淨利，還可能觸發連鎖事件。</p><p><b>🤝 合作模式：</b>兩人一起管理園遊會資金、討論價格與分工。任何陌生或保證獲利的邀請都先問可信任的大人。</p><div class="modalfoot"><button class="primary" id="helpClose">開始探險</button></div>';openModal();$('#helpClose').onclick=closeModal}
function init(){load();renderLevel();$('#helpBtn').onclick=help;$('#resetBtn').onclick=()=>resetGame(true);$$('.node').forEach(b=>b.onclick=()=>{if(+b.dataset.level<=state.level){document.querySelector('#gameCard').scrollIntoView({behavior:'smooth',block:'center'});if(!state.character)openCharacter()}});$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});if(!state.character&&state.level<5)setTimeout(openCharacter,250)}
init();
